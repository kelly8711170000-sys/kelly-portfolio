<style>

  .reveal { opacity: 0; transform: translateY(28px); transition: opacity 0.7s ease, transform 0.7s ease; }
  .reveal.in-view { opacity: 1; transform: translateY(0); }

  /* Outlined numeral watermark */
  .stroke-num {
    -webkit-text-stroke: 1.5px rgba(23,23,23,0.18);
    color: transparent;
  }

  /* Scroll cue */
  @keyframes float-slow {
    0%, 100% { transform: translateY(0); }

  .animate-float-slow { animation: float-slow 2.2s ease-in-out infinite; }

  /* Nav sliding hover indicator */

    background-color: #F25623;
    border-radius: 3px;
    pointer-events: none;
    z-index: 100;

  }

  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    .reveal { opacity: 1; transform: none; transition: none; }
    #nav-indicator { transition: opacity 0.2s ease; }
    .cursor-trail-dot { display: none; }

<div class="cursor-trail-dot" data-trail data-opacity="0.55" style="width:8px;height:8px;opacity:0"></div>
<div class="cursor-trail-dot" data-trail data-opacity="0.32" style="width:6px;height:6px;opacity:0"></div>
<div class="cursor-trail-dot" data-trail data-opacity="0.16" style="width:5px;height:5px;opacity:0"></div>

<script>
  document.getElementById('year').textContent = new Date().getFullYear();

  const prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const revealEls = document.querySelectorAll('.reveal');

  if (prefersReduced) {
    revealEls.forEach(el => el.classList.add('in-view'));
  } else {
    const io = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add('in-view');
          io.unobserve(entry.target);
        }
      });
    }, { threshold: 0.15 });
    revealEls.forEach(el => io.observe(el));
  }

  // Hero particle field — a grid of small orange blocks that shimmer
  // independently (each cell flickers on its own noise cycle), canvas-based
  // so hundreds of cells stay cheap to redraw every frame.
  (function () {
    const canvas = document.getElementById('wave-field');
    if (!canvas) return;
    const wrapper = canvas.parentElement;
    const ctx = canvas.getContext('2d');
    const spacing = 40;
    const size = 14;
    let width, height, dpr, cells = [];

    function seededRandom(i, j) {
      const x = Math.sin(i * 12.9898 + j * 78.233) * 43758.5453;
      return x - Math.floor(x);
    }

    // Extend the field from the top of the hero down through the gap
    // right after the first Work card, so the fade-out tail lands there
    // instead of vanishing before the card ever ends.
    function targetHeight() {
      const firstCard = document.querySelector('#work .flex.flex-col > a');
      if (!firstCard) return wrapper.clientHeight;
      const wrapperTop = wrapper.getBoundingClientRect().top;
      const cardRect = firstCard.getBoundingClientRect();
      return (cardRect.top - wrapperTop) + cardRect.height;
    }

    function resize() {
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      width = wrapper.clientWidth;
      height = targetHeight();
      canvas.width = width * dpr;
      canvas.height = height * dpr;
      canvas.style.width = width + 'px';
      canvas.style.height = height + 'px';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      cells = [];
      const cols = Math.ceil(width / spacing) + 1;
      const rows = Math.ceil(height / spacing) + 1;
      for (let i = 0; i < cols; i++) {
        for (let j = 0; j < rows; j++) {
          cells.push({
            x: i * spacing,
            y: j * spacing,
            phase: seededRandom(i, j) * Math.PI * 2,
            freq: 0.5 + seededRandom(i + 1, j + 1) * 0.9,
          });
        }
      }
    }

    function render(t) {
      ctx.clearRect(0, 0, width, height);
      for (let k = 0; k < cells.length; k++) {
        const c = cells[k];
        const wave = (Math.sin(t * c.freq + c.phase) + 1) / 2;
        const flicker = wave * wave * wave;
        const fade = Math.pow(Math.max(0, 1 - c.y / height), 1.3);
        const alpha = (0.025 + flicker * 0.22) * fade;
        const s = size * (0.6 + flicker * 0.4);
        const half = s / 2;
        ctx.fillStyle = `rgba(140, 140, 140, ${alpha})`;
        if (ctx.roundRect) {
          ctx.beginPath();
          ctx.roundRect(c.x - half, c.y - half, s, s, 2);
          ctx.fill();
        } else {
          ctx.fillRect(c.x - half, c.y - half, s, s);
        }
      }
    }

    resize();
    window.addEventListener('resize', resize);

    if (prefersReduced) {
      render(0);
    } else {
      let start = null;
      function frame(now) {
        if (start === null) start = now;
        render((now - start) / 1000);
        requestAnimationFrame(frame);
      }
      requestAnimationFrame(frame);
    }
  })();

  // Nav sliding hover indicator
  (function () {
    const track = document.getElementById('nav-track');
    const indicator = document.getElementById('nav-indicator');
    const items = track.querySelectorAll('[data-nav-item]');

    function moveIndicator(el) {
      const trackRect = track.getBoundingClientRect();
      const rect = el.getBoundingClientRect();
      indicator.style.left = (rect.left - trackRect.left) + 'px';
      indicator.style.width = rect.width + 'px';
      indicator.style.opacity = '1';
    }

    items.forEach((item) => {
      item.addEventListener('mouseenter', () => moveIndicator(item));
      item.addEventListener('focus', () => moveIndicator(item));
    });
    track.addEventListener('mouseleave', () => { indicator.style.opacity = '0'; });
  })();

  // Fading orange cursor trail (fine pointer + no reduced motion only)
  (function () {
    const canHover = window.matchMedia('(hover: hover) and (pointer: fine)').matches;
    if (!canHover || prefersReduced) return;

    const dots = Array.from(document.querySelectorAll('[data-trail]')).map((el) => ({
      el, x: 0, y: 0,
    }));
    const mouse = { x: window.innerWidth / 2, y: window.innerHeight / 2 };
    let started = false;

    window.addEventListener('mousemove', (e) => {
      mouse.x = e.clientX;
      mouse.y = e.clientY;
      if (!started) {
        started = true;
        dots.forEach((d) => {
          d.x = mouse.x;
          d.y = mouse.y;
          d.el.style.opacity = d.el.dataset.opacity;
        });
      }
    });

    function tick() {
      let targetX = mouse.x;
      let targetY = mouse.y;
      dots.forEach((d, i) => {
        const ease = 0.32 - i * 0.05;
        d.x += (targetX - d.x) * ease;
        d.y += (targetY - d.y) * ease;
        const size = d.el.offsetWidth;
        d.el.style.transform = `translate(${d.x - size / 2}px, ${d.y - size / 2}px)`;
        targetX = d.x;
        targetY = d.y;
      });
      requestAnimationFrame(tick);
    }
    tick();
  })();
</script>
